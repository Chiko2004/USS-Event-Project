<body>
    <section itemscope itemtype="http://schema.org/Organization">
        <header>
            <div id="LogoIconDiv">
                <a href="/Student-Portal"><img src="{{ url_for('static', filename='Media/CSU_logo_white.svg') }}" alt="Logo"></a>
            </div>    

            <nav itemscope itemtype="http://schema.org/SiteNavigationElement" id="HeaderNav">
                <div id="HeaderNavDiv">
                    <!--Insert desgin here-->
                </div>
                    
                <section id="HeaderNavSec">
                    <ul>
                        <li><a href="/" target="_self">Home</a></li>
                        <li><a href="/About" target="_self">About</a></li>
                        <li><a href="/Contact" target="_self">Contact</a></li>
                        <li><a href="/Events" target="_self">Events</a></li>
                        <li><a href="/Gallery" target="_self">Gallery</a></li>
                        <li><a href="/What's new" target="_self">What's New</a></li>
                    </ul>
                </section>
            </nav>



            <div id="ProfileDiv">
                <a href="/profile"><img id="ProfileIcon" src="{{ url_for('static', filename='Media/profile-pic.jpg') }}" alt="Profile"></a>
                <a href="/Login"><p  id="ProfileUsername">Log in / Sign up</p> <!--if logged in, should change to user's name--></a>

                
            </div>
        
        </header>

<!--########################################################################################################-->
        <div id="MainContainer">        

<!--#######################################################################################################-->


            <main>
                <h2>Log in</h2>
                <fieldset id="Form">
                            <div>
                                <label for="email">Email:</label>
                                <input type="text" id="Email" name="Email">
                                <br>
                                <label for="Password">Password:</label>
                                <input type="text" id="Password" name="Password">
                                <br>
                                <p>don't have a login?<a href="/Signup"><button>Sign up</button></a></p>
                            </div>
                    
                </fieldset>
               
              
            </main>

        </div>

<!--#######################################################################################################-->


    </section>
