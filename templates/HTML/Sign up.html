<!DOCTYPE html>

<html lang="en">
<head>
    <link rel="icon" href="media/favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <title>USS Event Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/Main/General.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/Log in/loginheader.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/Log in/loginheader.css') }}">

<!--#######################################################################################################-->
<!--#################################       Navigation bar        ########################################-->
<!--#######################################################################################################-->

<body>
    <section itemscope itemtype="http://schema.org/Organization">
        <header>
            <div id="LogoIconDiv">
                <a href="/Student-Portal"><img id="LogoIcon" src="Media/CSU_logo_white.svg" alt="School Logo"></a>
            </div>      

            <nav itemscope itemtype="http://schema.org/SiteNavigationElement" id="HeaderNav">
                <div id="HeaderNavDiv">
                    <!--Insert desgin here-->
                </div>
                    
                <section id="HeaderNavSec">
                    <ul>
                        <li><a href="/" target="_self">Home</a></li>
                        <li><a href="/About" target="_self">About</a></li>
                        <li><a href="/Contact" target="_self">Contact</a></li>
                        <li><a href="/Events" target="_self">Events</a></li>
                        <li><a href="/Gallery" target="_self">Gallery</a></li>
                        <li><a href="/What's new" target="_self">What's New</a></li>
                    </ul>
                </section>
            </nav>



            <div id="ProfileDiv">
                <a href="/Login"><img id="ProfileIcon" src="Media\profile-pic.jpg" alt="Profile"></a>
                <a href="/Login"><p  id="ProfileUsername">Log in / Sign up</p> <!--if logged in, should change to user's name--></a>

                
            </div>
        
        </header>

<!--########################################################################################################-->
        <div id="MainContainer">        

<!--#######################################################################################################-->


            <main>
                <fieldset id="Form">
                        <legend>Sign up / Log in</legend>
                            <div>
                                <label for="email">Email:</label>
                                <input type="text" id="Email" name="Email" required>
                                <br>
                                <label for="Password">Password:</label>
                                <input type="text" id="Password" name="Password" required>
                                <br>
                                <p>already have an account?<a href="/Login"><button>Log in</button></a></p>
                            </div>
                    
                </fieldset>
               
              
            </main>

        </div>

<!--#######################################################################################################-->


    </section>
</body>
